name: Deploy sentinelfish to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

env:
  PYTHON_VERSION: '3.14'
  WEBAPP_NAME: development-sentinelfish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install requirements (validation only)
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate app.py imports
        run: |
          source antenv/bin/activate
          python -c "import app; print('app.py imports OK')"

      - name: Package app (no venv, no git metadata)
        run: |
          chmod +x startup.sh
          zip -r release.zip . \
            -x "antenv/*" ".git/*" ".github/*" "tests/*" "__pycache__/*" "*.pyc" ".env"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: development-sentinelfish
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: release.zip
