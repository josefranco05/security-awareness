# Python to Linux Web App on Azure
# Build your Python project and deploy it to Azure as a Linux Web App.
# Change python version to one thats appropriate for your application.
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- main

variables:
  azureServiceConnectionId: '1fc24039-0c8f-4a54-ae79-706f85f3b379'
  webAppName: 'development-sentinelfish'
  vmImageName: 'ubuntu-latest'
  environmentName: 'development-sentinelfish'
  projectRoot: $(System.DefaultWorkingDirectory)
  pythonVersion: '3.14'

stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'

    # --frozen: instala exactamente uv.lock y falla si no coincide con pyproject.toml.
    - script: |
        python -m pip install uv==0.11.29
        uv sync --frozen --no-dev
      workingDirectory: $(projectRoot)
      displayName: "Install dependencies (uv)"

    - script: |
        # Valores ficticios solo para el import; los reales están en las App Settings.
        # Van en línea y no en env: para que ninguna variable del pipeline los pise.
        SECRET_KEY=build-only-dummy \
        SECRET_KEY_AUTH=build-only-dummy \
        ACS_WEBHOOK_SECRET=build-only-dummy \
        DATABASE_URL=sqlite+aiosqlite:///./build.db \
        WORKER_DATABASE_URL=sqlite:///./build.db \
        CELERY_BROKER_URL=memory:// \
        EMAIL_BACKEND=log \
        ALLOWED_ORIGINS='["http://localhost"]' \
        uv run --frozen --no-dev python -c "import main; from ml.inferencia import cargar_modelo; cargar_modelo(); print('main.py y modelo OK')"
      workingDirectory: $(projectRoot)
      displayName: "Validate main.py imports and model"

    # El repo guarda el CSS legible; el paquete se despliega minificado.
    # rcssmin solo existe en este paso: no es dependencia de la app.
    - script: |
        uv run --frozen --no-dev --with rcssmin python -c "import pathlib, rcssmin; p = pathlib.Path('static/css/style.css'); antes = p.stat().st_size; p.write_text(rcssmin.cssmin(p.read_text(encoding='utf-8')), encoding='utf-8'); print(f'style.css: {antes} -> {p.stat().st_size} bytes')"
      workingDirectory: $(projectRoot)
      displayName: "Minify CSS"

    # App Service instala las dependencias con uv al desplegar, desde pyproject.toml y uv.lock.
    - script: |
        chmod +x startup.sh
        rm -rf .venv
      workingDirectory: $(projectRoot)
      displayName: "Prep for archive (chmod, drop build venv)"

    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(projectRoot)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      displayName: 'Upload package'
      artifact: drop

- stage: Deploy
  displayName: 'Deploy Web App'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python version'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
            displayName: 'Deploy Azure Web App : development-sentinelfish'