[project]
name = "security-awareness"
version = "0.1.0"
description = "Plataforma de simulación y detección de phishing dirigida a pequeñas y medianas empresas."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "josemfran05", email = "josefranco0502@outlook.com" }]
requires-python = ">=3.14"
dependencies = [
    # Web
    "fastapi[standard]>=0.141",
    "uvicorn[standard]>=0.53",
    "uvicorn-worker",
    "gunicorn>=26.0",
    "starlette>=1.6",
    "pydantic>=2.13",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-dotenv>=1.2",
    # Base de datos (PostgreSQL): asyncpg para la web, psycopg para el worker y Alembic.
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    # Worker / colas
    "celery[redis]>=5.6,<6",
    "redis>=5,<7",
    # Correo (Azure Communication Services)
    "azure-communication-email>=1.0,<2",
    # Autenticación
    "pwdlib[argon2]",
    "pyjwt",
    "pydantic-settings>=2.16.0",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    # Exacta: model.joblib se entrenó con esta versión y cargar_modelo() rechaza otra.
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "ml/tests"]
pythonpath = ["."]

[tool.uv]
# Aplicación (no librería): no se construye ni instala como paquete.
package = false
